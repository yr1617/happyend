<!-- TAB 3: MUSIC -->
<section id="tab-music" class="tab-content">
  <div class="cd-section">
    <div class="cd-section-title">
      <span>AUDIO PLAYER ARCHIVE</span>
      <span>SELECT CASE TO OPEN & DRAG CD TO TURNTABLE</span>
    </div>

    <div class="player-workspace">
      <!-- 턴테이블 오디오 플레이어 -->
      <div class="cd-player-device" id="dropZone">
        <!-- 턴테이블 바늘 (Tone Arm) -->
        <div class="tone-arm" id="toneArm">
          <div class="arm-base"></div>
          <div class="arm-rod"></div>
          <div class="arm-head"></div>
        </div>

        <div class="turntable-surface">
          <div class="player-deck" id="playerDeck">
            <div class="cd-tray" id="cdTray">
              <div class="tray-center-pin"></div>
              <span class="tray-text" id="trayText">DRAG & DROP CD HERE</span>
            </div>
          </div>
        </div>

        <div class="player-controls">
          <div class="track-status-wrap">
            <span class="status-indicator" id="statusIndicator"></span>
            <div class="track-display" id="trackDisplay">NO RECORD LOADED</div>
          </div>
          <button class="eject-btn" id="ejectBtn">EJECT</button>
        </div>
      </div>

      <!-- 쌓여있는 CD 랙 (Stacked Shelf) -->
      <div class="cd-stack-rack" id="cdRack">
        
        <!-- Track 01 -->
        <div class="cd-case-item" data-id="cd1">
          <div class="case-cover">
            <span class="case-num">01</span>
            <span class="case-title">HAPPYEND Theme (Opening)</span>
          </div>
          <div class="case-inside">
            <div class="cd-disc" id="cd1" draggable="true"
                 data-title="HAPPYEND Theme (Opening)" 
                 data-src="Lia Ouyang Rusli - HAPPYEND Theme (Opening)  Happyend (Original Motion Picture Soundtrack).mp3">
              <div class="cd-label-pattern"></div>
              <div class="cd-center-ring"><div class="cd-center-hole"></div></div>
            </div>
          </div>
        </div>

        <!-- Track 02 -->
        <div class="cd-case-item" data-id="cd2">
          <div class="case-cover">
            <span class="case-num">02</span>
            <span class="case-title">HAPPYEND Theme (Closing)</span>
          </div>
          <div class="case-inside">
            <div class="cd-disc" id="cd2" draggable="true"
                 data-title="HAPPYEND Theme (Closing)" 
                 data-src="Lia Ouyang Rusli - HAPPYEND Theme (Closing)  Happyend (Original Motion Picture Soundtrack).mp3">
              <div class="cd-label-pattern"></div>
              <div class="cd-center-ring"><div class="cd-center-hole"></div></div>
            </div>
          </div>
        </div>

        <!-- Track 03 -->
        <div class="cd-case-item" data-id="cd3">
          <div class="case-cover">
            <span class="case-num">03</span>
            <span class="case-title">SUBWOOFER</span>
          </div>
          <div class="case-inside">
            <div class="cd-disc" id="cd3" draggable="true"
                 data-title="SUBWOOFER" 
                 data-src="Lia Ouyang Rusli - SUBWOOFER  Happyend (Original Motion Picture Soundtrack).mp3">
              <div class="cd-label-pattern"></div>
              <div class="cd-center-ring"><div class="cd-center-hole"></div></div>
            </div>
          </div>
        </div>

        <!-- Track 04 -->
        <div class="cd-case-item" data-id="cd4">
          <div class="case-cover">
            <span class="case-num">04</span>
            <span class="case-title">WORLD (Variation 1)</span>
          </div>
          <div class="case-inside">
            <div class="cd-disc" id="cd4" draggable="true"
                 data-title="WORLD (Variation 1)" 
                 data-src="WORLD (Variation 1).mp3">
              <div class="cd-label-pattern"></div>
              <div class="cd-center-ring"><div class="cd-center-hole"></div></div>
            </div>
          </div>
        </div>

        <!-- Track 05 -->
        <div class="cd-case-item" data-id="cd5">
          <div class="case-cover">
            <span class="case-num">05</span>
            <span class="case-title">LOVE (Variation 1)</span>
          </div>
          <div class="case-inside">
            <div class="cd-disc" id="cd5" draggable="true"
                 data-title="LOVE (Variation 1)" 
                 data-src="Lia Ouyang Rusli - LOVE (Variation 1)  Happyend (Original Motion Picture Soundtrack).mp3">
              <div class="cd-label-pattern"></div>
              <div class="cd-center-ring"><div class="cd-center-hole"></div></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
